name: InstallNginx
description: Install nginx and update system
schemaVersion: 1.0

phases:
  - name: build
    steps:
      - name: UpdateSystem
        action: ExecuteBash
        inputs:
          commands:
            - yum update -y

      - name: InstallNginx
        action: ExecuteBash
        inputs:
          commands:
            - yum install -y nginx

